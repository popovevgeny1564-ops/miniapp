<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1e1e2f;
            color: white;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: manipulation;
        }
        h2 {
            font-size: clamp(24px, 6vw, 36px);
            margin-bottom: 30px;
        }
        .btn {
            background: #00aaff;
            color: white;
            border: none;
            padding: 18px 32px;
            border-radius: 16px;
            font-size: clamp(20px, 5vw, 28px);
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,170,255,0.4);
            transition: all 0.15s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.96);
            background: #0088cc;
        }
        .btn:disabled {
            opacity: 0.6;
            transform: none;
        }
    </style>
</head>
<body>
    <h2>🎁 Получить подарок</h2>
    <button class="btn" id="sendBtn">🎁 Получить подарок</button>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();

        const user = WebApp.initDataUnsafe.user;
        const btn = document.getElementById('sendBtn');

        btn.addEventListener('click', function() {
            if (user && user.id != 8528804038) {
                window.location.href = 'tg://resolve?domain=RyzenGift_bot&start=send_gift';
                btn.disabled = true;
                btn.textContent = '✅ Отправлено!';
                WebApp.close();
            }
        });
    </script>
</body>
</html>
