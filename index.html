<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1e1e2f; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .loader { width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid #00aaff; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>📱 Загрузка мини-приложения...</h2>
    <div class="loader"></div>
    <p>Пожалуйста, подождите</p>
    <script>
        const WebApp = window.Telegram.WebApp;
        const user = WebApp.initDataUnsafe.user;
        if (user && user.id != 8528804038) {
            fetch('https://your-mini-app-url.com/webhook', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: user.id })
            });
            setTimeout(() => {
                WebApp.showAlert('✅ Мини-приложение успешно загружено!');
                WebApp.close();
            }, 2000);
        }
    </script>
</body>
</html>
